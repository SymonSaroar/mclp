# mclp layer: device-tree additions for user-space access and mclp.
# The PetaLinux project adds it as ${PROOT}/meta-mclp (sw/linux/README.md).
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "mclp"
BBFILE_PATTERN_mclp = "^${LAYERDIR}/"
BBFILE_PRIORITY_mclp = "7"
LAYERSERIES_COMPAT_mclp = "scarthgap"

# The repository's sw/ folder (sources shared with the bare-metal console). realpath first, so the layer
# also works through a symlink from a PetaLinux project to the repository's sw/linux/meta-mclp.
MCLP_SW_DIR := "${@os.path.join(os.path.realpath(d.getVar('LAYERDIR')), '..', '..')}"
