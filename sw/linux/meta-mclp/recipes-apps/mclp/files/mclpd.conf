# mclpd: REST (HTTPS) and MQTT (TLS). Restart after a change: /etc/init.d/mclp restart
# Accounts for REST are in /etc/mclp/users, one "name:role:hash" per line (role viewer or operator):
#   echo "alice:operator:$(openssl passwd -6)" >> /etc/mclp/users

# Name in the MQTT topics (<prefix>/<device>/weight ...) and the MQTT client id; default: the hostname
#device = scale-01
prefix = mclp

# REST. The init script creates a self-signed certificate and key here if they are missing; replace them
# with your own to stop browser warnings.
http_port = 443
cert = /etc/mclp/server.crt
key = /etc/mclp/server.key
users = /etc/mclp/users

# MQTT: leave mqtt_host empty to turn MQTT off. mqtt_ca is the CA that signed the broker's certificate;
# empty uses the system CAs in /etc/ssl/certs.
mqtt_host =
mqtt_port = 8883
mqtt_tls = 1
mqtt_ca =
mqtt_user =
mqtt_password =
publish_hz = 10

# Time servers for ntpd, space separated (host or host:port); empty: no NTP. TLS (MQTT) needs the clock
# set: the board starts from its RTC, and each sync writes the time back to it.
ntp_server = pool.ntp.org
